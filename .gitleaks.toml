# gitleaks config — extends the default ruleset; no rule changes here, only path allowlists.
# Audited 2026-04-18: these paths are false positives we don't want to re-litigate on every commit.

[extend]
useDefault = true

[allowlist]
description = "Paths with legitimate example/fixture/binary content that tripped default rules"
paths = [
  # Doc examples using curl -H "Authorization: Bearer ..."
  '''agents/skills/moltbook/SKILL\.md$''',
  '''agents/skills/moltbook/MESSAGING\.md$''',
  '''agents/skills/moltbook/HEARTBEAT\.md$''',

  # Test fixtures with literal "test_api_key_*" style strings
  '''agents/skills/.*/tests/.*\.py$''',

  # Automator .wflow bundles — base64-encoded binary plists, broad regexes match noise
  '''services/.*\.workflow/Contents/document\.wflow$''',
]
