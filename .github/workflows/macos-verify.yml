name: macOS verification

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: macOS static and fixture gates
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # actions/checkout@v5
      - name: Check shell syntax
        shell: bash
        run: |
          for file in install.sh scripts/*.sh macos/*.sh; do bash -n "$file"; done
      - name: Verify rule and skill inventories
        run: make rules-audit skills
      - name: Run checkout-safe fixtures
        shell: bash
        run: |
          bash scripts/validate-manifests.sh all
          make audit-apps
          python3 tests/test_bootstrap_health.py
