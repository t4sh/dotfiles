name: macOS verification

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: macOS static and fixture gates
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Install audit dependency
        run: brew install ripgrep
      - name: Check shell syntax
        shell: bash
        run: |
          for file in install.sh scripts/*.sh scripts/lib/*.sh macos/*.sh; do bash -n "$file"; done
          for file in zsh/zshrc zsh/zprofile zsh/zshenv zsh/z-monokai zsh/lib/*.zsh; do zsh -n "$file"; done
      - name: Verify rule and skill inventories
        run: make rules-audit skills
      - name: Run checkout-safe fixtures
        shell: bash
        run: |
          bash scripts/validate-manifests.sh all
          make audit-apps
          make test-public
