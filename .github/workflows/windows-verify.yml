name: Windows verification

on:
  push:
    branches: [main]
  workflow_dispatch:

# Native public Windows fixtures are opt-in: dispatch or a final [full ci] push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[full ci]') }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[full ci]')
    name: Native public Windows fixtures
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Install fixture runtimes
        shell: pwsh
        run: |
          python -m venv "$env:RUNNER_TEMP\dotfiles-ci"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP\dotfiles-ci\Scripts\python.exe" -m pip install uv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$env:RUNNER_TEMP\dotfiles-ci\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Append
          choco install age.portable --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install fixture scanner
        shell: pwsh
        run: |
          choco install gitleaks --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Command gitleaks.exe -ErrorAction Stop | Out-Null
      - name: Install managed Python
        shell: pwsh
        run: |
          uv python install 3.12
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Command age.exe, age-keygen.exe, uv.exe -ErrorAction Stop | Out-Null
      - name: Run native Windows fixtures
        shell: pwsh
        run: |
          $fixtures = @(
            'test_public_windows.ps1',
            'test_public_windows_editors.ps1',
            'test_public_windows_maintenance.ps1',
            'test_public_windows_projection.ps1',
            'test_windows_skills_prompt.ps1',
            'test_windows_python_discovery.ps1',
            'test_windows_update_reporting.ps1',
            'test_public_windows_hermes.ps1'
          )
          foreach ($fixture in $fixtures) {
            & pwsh -NoProfile -File (Join-Path 'tests' $fixture)
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
